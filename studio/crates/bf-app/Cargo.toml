[package]
name = "bf-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "bf_app"
path = "src/lib.rs"

[[bin]]
name = "ballfight-studio"
path = "src/main.rs"

[dependencies]
bf-content.workspace = true
bf-core.workspace = true
bf-export.workspace = true
bf-pack.workspace = true
bf-picture.workspace = true
bf-sim.workspace = true
bf-sound.workspace = true
bf-story.workspace = true
chrono.workspace = true
cpal.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
png.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

# One copy at a time (a named lock) and bringing the open window forward (`startup`). CreateMutexW is behind
# Win32_Security.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# build.rs starts git through bf_pack::run, the one way programs are started.
bf-pack.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
