[package]
name = "bf-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Files on disk outside the app's own data: the pinned ffmpeg and its checked download (later: the package folder,
# the install, the shortcuts and removal).
[[bin]]
name = "ballfight-pack"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The real folders (desktop, Start menu, the app's data) as Windows names them, for `install::Layout::system`.
directories.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
zip.workspace = true

# Shortcuts: Windows' own item id list for a link's target (SHParseDisplayName, ILGetSize, ILFree), made on a thread
# of its own with COM set up for it (CoInitializeEx, CoUninitialize). See `install::lnk`.
# The update build (`run::run_family`): a Windows job that holds a program and every program it starts, so they stop
# together (CreateJobObjectW, AssignProcessToJobObject, TerminateJobObject), and waiting for a program to end
# (OpenProcess, WaitForSingleObject). The program starts suspended and its thread is let run once it is in the job
# (CreateToolhelp32Snapshot, Thread32First/Next, OpenThread, ResumeThread). CreateJobObjectW is behind Win32_Security.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
