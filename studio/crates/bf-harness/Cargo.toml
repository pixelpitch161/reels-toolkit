[package]
name = "bf-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The proving harness of milestone 3 (Task 6): the gates every fighter, theme and pair port runs against the
# Python kit's references in studio/reference/. Test support only: nothing of the app depends on it. A port's test
# is one file in tests/ (fighter_<slug>.rs, theme_<name>.rs, episode_<pair>.rs) that names its fighter, theme or
# pair to a suite macro; cargo finds it there, so no line of this file or any other shared file changes per port.
[dependencies]
bf-core.workspace = true
bf-sim.workspace = true
bf-story.workspace = true
bf-picture.workspace = true
bf-sound.workspace = true
bf-content.workspace = true
bf-export.workspace = true
bf-testdata = { path = "../bf-testdata" }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

# The traced run (`bf_sim::run_traced`, whose log shows a socket stub a port left empty) is the engine's test
# entry: the suites' macros reach it from the test files, where this turns it on.
[dev-dependencies]
bf-sim = { path = "../bf-sim", features = ["testing"] }
