[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelkit"
version = "0.1.0"
description = "Low-poly renderer + synth audio kit for 60 s vertical science/music reels"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow"]

[tool.setuptools]
packages = ["reelkit"]
